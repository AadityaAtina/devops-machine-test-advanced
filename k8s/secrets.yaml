# Define Secrets provider class here to pull secrets from Azure Key Vault using CSI driver.
# Use Managed Identity. Do NOT hardcode any credentials.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-secrets
  namespace: microservices
  labels:
    app: microservices
    managed-by: terraform
spec:
  provider: azure
  parameters:
    # Azure Key Vault name — injected at deploy time via pipeline variable
    keyvaultName: "${KEY_VAULT_NAME}"

    # Managed Identity client ID assigned to the AKS node pool
    # Set by Terraform output; referenced as a pipeline variable
    clientID: "${MANAGED_IDENTITY_CLIENT_ID}"

    # Azure AD tenant ID
    tenantId: "${AZURE_TENANT_ID}"

    # Objects to pull from Key Vault
    objects: |
      array:
        - |
          objectName: db-host
          objectType: secret
          objectVersion: ""
        - |
          objectName: db-port
          objectType: secret
          objectVersion: ""
        - |
          objectName: db-name
          objectType: secret
          objectVersion: ""
        - |
          objectName: db-username
          objectType: secret
          objectVersion: ""
        - |
          objectName: db-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: jwt-secret
          objectType: secret
          objectVersion: ""

  # Sync the Key Vault secrets as a native Kubernetes Secret
  # so pods can consume them via envFrom or env.valueFrom
  secretObjects:
    - secretName: app-secrets
      type: Opaque
      data:
        - objectName: db-host
          key: DB_HOST
        - objectName: db-port
          key: DB_PORT
        - objectName: db-name
          key: DB_NAME
        - objectName: db-username
          key: DB_USERNAME
        - objectName: db-password
          key: DB_PASSWORD
        - objectName: jwt-secret
          key: JWT_SECRET
